# Lefthook Configuration
# Git hooks for code quality checks before commit/push

pre-commit:
  parallel: true
  commands:
    lint:
      run: npm run biome:fix
      stage_fixed: true
    stylelint:
      glob: "*.{css,scss}"
      run: npm run stylelint:fix
      stage_fixed: true
    typecheck:
      run: npm run tsc:check

pre-push:
  parallel: true
  commands:
    test:
      run: npm run jest:test
    build:
      run: npm run build:packages
