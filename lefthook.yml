# Lefthook Configuration
# Git hooks for code quality checks before commit/push

pre-commit:
  parallel: true
  commands:
    lint:
      run: npm run lint:fix
      stage_fixed: true
    format:
      run: npm run format
      stage_fixed: true
    typecheck:
      run: npm run typecheck

pre-push:
  parallel: true
  commands:
    test:
      run: npm run test
    build:
      run: npm run build:packages
