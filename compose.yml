services:
  # UI Website (Docs with integrated Playground)
  akex:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: akex
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/.next
    command: npm run dev:web
