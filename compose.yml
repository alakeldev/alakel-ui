services:
  # UI Website (Docs with integrated Playground)
  alakel-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: alakel-ui
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/.next
    command: npm run dev:web
